<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes recettes</title>
<style>
@font-face{font-family:Lato;src:url(fonts/Lato-Thin.ttf) format('truetype');font-weight:100;font-style:normal;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-ThinItalic.ttf) format('truetype');font-weight:100;font-style:italic;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-Light.ttf) format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-LightItalic.ttf) format('truetype');font-weight:300;font-style:italic;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-Regular.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-Italic.ttf) format('truetype');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-Bold.ttf) format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-BoldItalic.ttf) format('truetype');font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-Black.ttf) format('truetype');font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:Lato;src:url(fonts/Lato-BlackItalic.ttf) format('truetype');font-weight:900;font-style:italic;font-display:swap}
:root{color-scheme:light;--bg:#fbf8f4;--card:#fff;--tx:#2d2621;--mu:#867b71;--ac:#c2562b;--ach:#a9471f;--acs:#f8ebe3;--bd:#ece3d8;--sh:0 1px 2px rgba(60,40,20,.05),0 4px 16px rgba(60,40,20,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Lato,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px clamp(16px,3vw,48px)}
main.mid{max-width:1100px}
h1{font:700 26px Lato,system-ui,sans-serif;margin:0;cursor:pointer;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover{background:var(--ach);border-color:var(--ach)}
button.d{color:#c0392b}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
textarea{min-height:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:14px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}.rc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(60,40,20,.12)}
.rc .im{aspect-ratio:4/3;background:var(--acs) center/cover;display:flex;align-items:center;justify-content:center;font-size:40px}
.rc div.t{padding:10px 12px}.rc b{display:block}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin:2px 4px 2px 0;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{margin:10px 0}.f label{display:block;font-size:14px;color:var(--mu);margin-bottom:3px}
.ing{display:grid;grid-template-columns:28px 1fr 80px 90px 30px 36px;gap:6px;margin-bottom:6px;align-items:center}
.ing .tc{width:18px;height:18px;padding:0;margin:auto;cursor:pointer}
.ing.t [data-k=q],.ing.t [data-k=u]{visibility:hidden}.ing.t [data-k=name]{font-weight:700}
.ti{list-style:none;font-weight:700;margin:18px 0 6px -24px}.ti:first-child{margin-top:4px}
.steps{white-space:pre-wrap;line-height:1.7}#stp{min-height:260px}
.hero{width:100%;max-height:480px;object-fit:cover;border-radius:14px;margin:8px 0}
li{margin:6px 0}.mu{color:var(--mu)}
.st{font-size:13px;color:var(--mu)}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{padding:0;font-size:10px;line-height:15px;border-radius:6px}.mv button:disabled{opacity:.3;cursor:default}
.fam{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}.fam.np{border-left:4px solid var(--ac)}
.prow2{display:grid;grid-template-columns:1fr 90px 110px 1fr 36px;gap:6px;margin-bottom:8px}
.vrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.vrow .chip{cursor:default;margin:0}.vrow .pv{flex:1;min-width:170px;width:auto;padding:5px 10px}
.gh{font:600 17px Lato,system-ui,sans-serif;margin:18px 0 8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:6px}
.tbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;min-height:130px}
.tbox:hover{border-color:var(--ac)}.tbox.new{border:2px dashed var(--ac)}
.tbox h3{font:600 17px Lato,system-ui,sans-serif;margin:0 0 8px}.tbox ul{list-style:none;margin:0;padding:0}
.tbox li{display:flex;justify-content:space-between;gap:8px;margin:3px 0;font-size:14px}.tbox li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.prow2{grid-template-columns:1fr 1fr 1fr 36px}.prow2 .pn{grid-column:1/-1}.ing{grid-template-columns:24px 1fr 56px 64px 26px 32px;gap:4px}}
.cost{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}
/* Accueil : barre de recherche, carrousel, catégories */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}
.bar #q{flex:1;min-width:220px;padding:12px 18px;border-radius:999px;border-color:transparent;box-shadow:var(--sh)}
.bar #q:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.sec-h h2{font:700 21px Lato,system-ui,sans-serif;margin:0}.sec-h button{align-self:center}
.car-in{position:relative}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:4px 2px 12px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(440px,86%);scroll-snap-align:start;position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;cursor:pointer;background:var(--acs);box-shadow:var(--sh);outline-offset:3px}
.slide .bg{position:absolute;inset:0;background:center/cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.slide:hover .bg{transform:scale(1.04)}
.slide .emo{position:absolute;inset:0 0 25% 0;display:flex;align-items:center;justify-content:center;font-size:60px}
.slide .ov{position:absolute;inset:auto 0 0 0;padding:48px 18px 14px;background:linear-gradient(transparent,rgba(30,18,10,.72));color:#fff}
.slide.noimg .ov{background:none;color:var(--ac)}.slide.noimg .ov span{color:var(--mu);opacity:1}
.slide .ov b{display:block;font-size:20px;line-height:1.25}.slide .ov span{font-size:14px;opacity:.92}
.car-nav{position:absolute;top:calc(50% - 26px);width:42px;height:42px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:var(--sh);font-size:22px;line-height:1;opacity:0;transition:opacity .25s}
.car-nav.l{left:10px}.car-nav.r{right:10px}.car-in:hover .car-nav,.car-nav:focus-visible{opacity:1}
@media (hover:none){.car-nav{display:none}}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:99px;background:var(--bd);transition:width .35s,background .35s}.dots button.on{width:24px;background:var(--ac)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.ct{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--acs);box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;outline-offset:3px}
.ct:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(60,40,20,.12)}
.ct-im{position:absolute;inset:0;background:center/cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}.ct:hover .ct-im{transform:scale(1.05)}
.ct-emo{position:absolute;inset:0 0 30% 0;display:flex;align-items:center;justify-content:center;font-size:44px}
.ct-ov{position:absolute;inset:auto 0 0 0;padding:32px 14px 11px;background:linear-gradient(transparent,rgba(30,18,10,.7));color:#fff}
.ct-ov b{display:block;font-size:17px;line-height:1.2}.ct-ov span{font-size:13px;opacity:.92}
.ct.noimg .ct-ov{background:none;color:var(--ac)}.ct.noimg .ct-ov span{color:var(--mu);opacity:1}
.ct-ed{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:var(--sh);font-size:15px;opacity:0;transition:opacity .2s}
.ct:hover .ct-ed,.ct-ed:focus-visible{opacity:1}@media (hover:none){.ct-ed{opacity:1}}
@media (max-width:560px){.cgrid{grid-template-columns:1fr 1fr;gap:12px}.bar .acts{width:100%}.bar .acts button{flex:1 1 auto;white-space:nowrap;padding:8px 10px;font-size:15px}}
@media (prefers-reduced-motion:reduce){.car{scroll-behavior:auto}.slide .bg,.ct-im,.ct,.rc{transition:none}}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100% - 32px));background:var(--card);color:var(--tx);box-shadow:0 24px 64px rgba(40,25,15,.28)}
dialog::backdrop{background:rgba(40,25,15,.35)}
.dlg{padding:18px 20px}.dlg h3{margin:0 0 4px;font:700 19px Lato,system-ui,sans-serif}
.dlg-im{aspect-ratio:2/1;border-radius:12px;background:var(--acs) center/cover;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--mu);font-size:14px}
.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd);font-size:13px;line-height:1;color:var(--mu)}.sw.on{box-shadow:0 0 0 2px var(--tx)}.sw.none{background:var(--card)}
/* Glaces */
.gl-form{display:grid;grid-template-columns:2fr 1fr;gap:4px 14px;align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 14px;margin:10px 0;box-shadow:var(--sh)}
#get button{flex:1}
.gl-acts{margin:14px 0 -4px}.gl-acts .chip{cursor:default}
.gl-eh{display:grid;grid-template-columns:2fr 80px 1.4fr;gap:0 12px;align-items:end}
.gl-erow{border-bottom:1px solid var(--bd);padding:8px 0}.gl-erow:last-child{border-bottom:0;margin-bottom:8px}
.gl-eline{display:grid;grid-template-columns:1fr 110px auto 36px;gap:8px;align-items:center}.gl-eline button{padding:6px 0}
.gl-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0 0}.gl-mini{display:flex;flex-direction:column;font-size:13px;color:var(--mu);width:110px}.gl-mini.gl-wide{width:200px}.gl-mini input{padding:6px 9px}
.gl-verdict{border-radius:10px;padding:10px 14px;margin:0 0 10px}.gl-verdict ul{margin:6px 0 0}.gl-verdict li{margin:4px 0}
.gl-verdict.ok{background:#eaf6ec;border:1px solid #b9dfc0}.gl-verdict.ko{background:#fff6e0;border:1px solid #f1d58a}
.gl-adv{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:10px 0}.gl-adv summary{cursor:pointer;font-weight:700}
.gl-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}
.gl-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:14px 0;box-shadow:var(--sh)}
.gl-card h3{font:700 19px Lato,system-ui,sans-serif;margin:2px 0 10px}.gl-card h4{margin:12px 0 4px;font-size:16px}.gl-card ul{margin:0;padding-left:20px}
.gl-card table{width:100%;border-collapse:collapse}.gl-card td,.gl-card th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.gl-card .n{text-align:right;white-space:nowrap}.gl-card tfoot td{font-weight:700;border-bottom:0}
.gl-ing td:first-child{width:100%}.gl-ing b{font-size:17px}
.gl-scroll{overflow-x:auto}.gl-at{font-size:14px;min-width:620px}.gl-at th{color:var(--mu);font-weight:700;text-align:right}.gl-at th:first-child{text-align:left}
.gl-chk td:first-child{width:28px}.gl-chk .gl-v{white-space:normal;max-width:45%}
.gl-steps li{margin:8px 0;line-height:1.55}
.gl-warn{background:#fff6e0;border:1px solid #f1d58a;border-radius:10px;padding:8px 12px;margin:8px 0}
.gl-err{background:#fdecea;border:1px solid #f3b8b0;border-radius:10px;padding:10px 12px;color:#a5281b}
@media (max-width:700px){.gl-form,.gl-eh{grid-template-columns:1fr}.gl-eline{grid-template-columns:1fr 80px auto 32px;gap:6px}}
@media print{header,.row,.gl-adv,.gl-form,#st{display:none!important}.gl-card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>

<body>
<main>
<header><h1>🍲 Mes recettes</h1><span class="st" id="st"></span></header>
<div id="app"></div>
</main>
<script src="glaces.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let catsMeta=[],recipes=[], view={m:'list'}, filt={q:'',cat:''}, store=null, assets=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>{n=Math.round(n*100)/100;return String(n).replace('.',',')};
const imgUrl=id=>/^[a-f0-9]{24}\.(jpg|png|webp)$/.test(id||'')?'uploads/'+id:'';
const num=v=>{v=+v;return isFinite(v)&&v>0?v:0};
const byTitle=(a,b)=>String(a.title??'').localeCompare(String(b.title??''));
const byName=(x,y)=>String(x.name??'').localeCompare(String(y.name??''));

// ---- Stockage : db partagée (sync) ou localStorage en secours ----
function localStore(){
  const K='recettes-v1',cbs=[];
  const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};
  const push=()=>cbs.forEach(f=>f(load()));
  return{sync:false,
    watch(cb){cbs.push(cb);cb(load())},
    save(r){const a=load().filter(x=>x.id!==r.id);a.push(r);try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}push()},
    del(id){try{localStorage.setItem(K,JSON.stringify(load().filter(x=>x.id!==id)))}catch(e){}push()}};
}
async function init(){
  render();
  try{
    const api=(a,id,col)=>'api.php?action='+a+(id?'&id='+encodeURIComponent(id):'')+(col?'&col='+col:'');
    const first=await fetch(api('list'),{cache:'no-store'});
    if(!first.ok)throw 0;
    await first.json();
    assets={upload:async blob=>{const r=await fetch(api('upload'),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:blob});if(!r.ok)throw 0;return r.json()}};
    store={sync:true,last:'',
      async pull(cb){try{const [a,b,c]=await Promise.all(['','prices','cats'].map(k=>fetch(api('list',0,k),{cache:'no-store'}).then(r=>r.text())));const t=a+'|'+b+'|'+c;if(t!==this.last){const d=JSON.parse(a),p=JSON.parse(b);this.last=t;{let m=[];try{m=JSON.parse(c)}catch(e){}catsMeta=Array.isArray(m)?m:[]}prices=p.filter(x=>!x.meta);const mt=p.find(x=>x.meta);ptypes=mt&&Array.isArray(mt.types)?mt.types:DEFTYPES.slice();pcolors=mt&&mt.colors&&typeof mt.colors==='object'?mt.colors:{};(cb||this.cb)(d)}}catch(e){}},
      watch(cb){this.cb=cb;this.pull();setInterval(()=>this.pull(),10000)},
      async save(r){const x=await fetch(api('save',r.id),{method:'POST',body:JSON.stringify(r)});if(!x.ok)throw 0;await this.pull()},
      async del(id){const x=await fetch(api('delete',id),{method:'POST'});if(!x.ok)throw 0;await this.pull()},
      async savePrice(p){const x=await fetch(api('save',p.id,'prices'),{method:'POST',body:JSON.stringify(p)});if(!x.ok)throw 0},
      async saveCat(c){const x=await fetch(api('save',c.id,'cats'),{method:'POST',body:JSON.stringify(c)});if(!x.ok)throw 0},
      async delCat(id){const x=await fetch(api('delete',id,'cats'),{method:'POST'});if(!x.ok)throw 0},
      async delPrice(id){const x=await fetch(api('delete',id,'prices'),{method:'POST'});if(!x.ok)throw 0}};
  }catch(e){}
  if(!store) store=localStore();
  $('h1').onclick=()=>{filt={q:'',cat:''};view={m:'list'};render()};
  $('#st').textContent=store.sync?'':'⚠️ serveur injoignable : données locales uniquement';
  store.watch(a=>{recipes=a;if(view.m==='list'&&$('#q'))refresh();else if(view.m!=='edit'&&view.m!=='prices'&&view.m!=='glaces')render(true)});
}

// ---- Rendu ----
function render(keep){
  const y=window.scrollY;stopCar();
  document.querySelector('main').classList.toggle('mid',view.m!=='list');
  if(view.m==='list')list();else if(view.m==='show')show();else if(view.m==='prices')pricesView();else if(view.m==='glaces')glacesView();else edit();
  window.scrollTo(0,keep?y:0);
}
const catsOf=r=>Array.isArray(r.cats)?r.cats:(r.cat?[r.cat]:[]);
const cats=()=>[...new Set(recipes.flatMap(catsOf))].sort();
const tags=()=>[...new Set(recipes.flatMap(r=>r.tags||[]))].sort();
const SAIS=[['printemps','🌸 Printemps'],['ete','☀️ Été'],['automne','🍂 Automne'],['hiver','❄️ Hiver'],['intemporel','♾️ Intemporel']];
const saisLabel=k=>(SAIS.find(x=>x[0]===k)||[])[1]||'';
function curSeason(d=new Date()){const v=(d.getMonth()+1)*100+d.getDate();return v>=1221||v<320?'hiver':v<621?'printemps':v<922?'ete':'automne'}
function rnd(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function daily(){
  const d=new Date(),sea=curSeason(d),r=rnd(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate());
  const pool=recipes.filter(x=>x.carousel!==false&&(!x.saison||x.saison==='intemporel'||x.saison===sea)).sort((a,b)=>a.id<b.id?-1:1);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  pool.sort((a,b)=>(b.saison===sea)-(a.saison===sea));
  return pool.slice(0,6);
}
function carousel(){
  if(!recipes.length)return'';
  const d=daily(),sea=curSeason();
  const head=`<div class="sec-h"><h2>✨ Idées du jour</h2><span class="st">${saisLabel(sea)}</span></div>`;
  if(!d.length)return `<section>${head}<p class="mu st">Aucune recette proposée pour cette saison. Cochez « Afficher dans le carrousel » dans l'édition d'une recette.</p></section>`;
  const slide=r=>{const u=imgUrl(r.img),t=num(r.prep)+num(r.cook);
    return `<div class="slide${u?'':' noimg'}" data-id="${esc(r.id)}" tabindex="0" role="button">${u?`<div class="bg" style="background-image:url('${esc(u)}')"></div>`:'<div class="emo">🍽️</div>'}<div class="ov"><b>${esc(r.title)}</b><span>${esc(saisLabel(r.saison||'intemporel'))}${t?` · ${t} min`:''}</span></div></div>`};
  const many=d.length>1;
  return `<section>${head}<div class="car-in"><div class="car" id="ct">${d.map(slide).join('')}</div>${many?'<button class="car-nav l" id="cl" aria-label="Précédent">‹</button><button class="car-nav r" id="cr" aria-label="Suivant">›</button>':''}</div>${many?`<div class="dots" id="cdots">${d.map((_,i)=>`<button data-dot="${i}" aria-label="Idée ${i+1}"></button>`).join('')}</div>`:''}</section>`;
}
// Carrousel : défilement natif (glisser au doigt), aimanté, avance seul toutes les 5 s, se met en pause au survol ou après une action
let carT=null;
function stopCar(){if(carT){clearInterval(carT);carT=null}}
function startCar(){
  stopCar();const ct=$('#ct');if(!ct||ct.children.length<2)return;
  const sl=[...ct.children],dots=[...document.querySelectorAll('#cdots [data-dot]')];
  const max=()=>ct.scrollWidth-ct.clientWidth,pos=i=>Math.min(sl[i].offsetLeft-sl[0].offsetLeft,max());
  const cur=()=>{if(ct.scrollLeft>=max()-4)return sl.length-1;let b=0,bd=1e9;sl.forEach((_,i)=>{const d=Math.abs(pos(i)-ct.scrollLeft);if(d<bd){bd=d;b=i}});return b};
  const to=x=>ct.scrollTo({left:x,behavior:'smooth'});
  const next=()=>{const i=sl.findIndex((_,i)=>pos(i)>ct.scrollLeft+4);to(i<0?0:pos(i))};
  const prev=()=>{let j=-1;sl.forEach((_,i)=>{if(pos(i)<ct.scrollLeft-4)j=i});to(j<0?max():pos(j))};
  const mark=()=>{const c=cur();dots.forEach((d,i)=>d.classList.toggle('on',i===c))};
  const layout=()=>{dots.forEach((d,i)=>d.hidden=i<sl.length-1&&pos(i+1)-pos(i)<4);mark()};
  let raf=0,idle=0,hover=false;const hold=()=>{idle=Date.now()};
  ct.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(mark)},{passive:true});
  ['pointerdown','wheel','touchstart','keydown'].forEach(e=>ct.addEventListener(e,hold,{passive:true}));
  const box=ct.parentElement;box.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true});box.addEventListener('pointerleave',()=>{hover=false});
  dots.forEach(d=>d.onclick=()=>{hold();to(pos(+d.dataset.dot))});
  $('#cl').onclick=()=>{hold();prev()};$('#cr').onclick=()=>{hold();next()};
  window.onresize=()=>{if(ct.isConnected)layout()};
  layout();
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)
    carT=setInterval(()=>{if(!ct.isConnected){stopCar();return}if(document.hidden||hover||Date.now()-idle<8000)return;next()},5000);
}

function refresh(){

      const hay=nn([r.title,catsOf(r).join(' '),(r.tags||[]).join(' '),(r.ings||[]).filter(i=>!i.t).map(ingName).join(' ')].join(' '));

let prices=[],ptypes=[],pcolors={};
const PALETTE=[['#c2562b','Terracotta'],['#e07a5f','Corail'],['#d9a441','Ocre'],['#8a9a3b','Olive'],['#81a684','Sauge'],['#3f7d58','Vert forêt'],['#2f7a8c','Pétrole'],['#6a9fc9','Bleu ciel'],['#3d5a80','Bleu nuit'],['#8d7fc2','Lavande'],['#7b4b7a','Prune'],['#d98ca3','Rose poudré'],['#8c3b3b','Bordeaux'],['#8b6b4f','Brun'],['#6b7280','Ardoise']];

const DEFTYPES=['Fruits et légumes','Laitages','Viandes','Poissons','Épicerie','Boulangerie','Boissons','Condiments et épices','Surgelés','Autre'];
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const nn=x=>' '+norm(x).replace(/[^a-z0-9]+/g,' ').trim().split(' ').map(w=>w.replace(/[sx]$/,'')).join(' ')+' ';

// Famille la plus proche d'un nom : nom exact (famille ou variante), sinon le plus long nom connu contenu dans le nom saisi
function famGuess(name,okOnly){
  const n=nn(name);let best=null,bl=0;
  for(const p of prices){if(okOnly&&!okP(p))continue;
    for(const x of famNames(p)){const nx=nn(x);if(!nx.trim())continue;if(nx===n)return p;if(n.includes(nx)&&nx.length>bl){best=p;bl=nx.length}}}
  return best;
}
const findPrice=name=>famGuess(name,true);
function unitInfo(u){
  const x=norm(u).replace(/[.\s]/g,''),T={mg:['m',1e-6],g:['m',1e-3],gr:['m',1e-3],gramme:['m',1e-3],grammes:['m',1e-3],kg:['m',1],kilo:['m',1],kilos:['m',1],
    ml:['v',1e-3],cl:['v',1e-2],dl:['v',.1],l:['v',1],litre:['v',1],litres:['v',1],
    cas:['v',.015],casoupe:['v',.015],cuillereasoupe:['v',.015],cuilleresasoupe:['v',.015],cac:['v',.005],cacafe:['v',.005],cuillereacafe:['v',.005],cuilleresacafe:['v',.005]};
  return(['','piece','pieces','pc','u','portion','portions','part','parts','tranche','tranches','unite','unites'].includes(x))?['p',1]:(T[x]||null);
}
// ---- Sous-recettes : une ligne {rref:id recette, q, u} = une quantité d'une autre recette ----
function contains(rid,target,seen=new Set()){if(seen.has(rid))return false;seen.add(rid);const x=recipes.find(y=>y.id===rid);return !!x&&(x.ings||[]).some(i=>i.rref&&(i.rref===target||contains(i.rref,target,seen)))}
function yieldOf(r){const has=+r.yq>0,ui=unitInfo(has?(r.yu||''):'portions');return ui?{q:has?+r.yq:(+r.serv||1),ui}:null}
function recipeCost(r,k,stack=[]){
  const st=stack.concat(r.id);let tot=0;const miss=[],bad=[];
  (r.ings||[]).filter(i=>!i.t).forEach(i=>{const c=lineCost(i,k,st);
    if(c.s==='ok'){tot+=c.c;if(c.miss)miss.push(...c.miss);if(c.bad)bad.push(...c.bad)}
    else if(c.s==='noprice')miss.push(ingName(i));else bad.push(ingName(i))});
  return{tot,miss:[...new Set(miss)],bad:[...new Set(bad)]};
}
function lineCost(i,k,stack=[]){
  if(i.rref!==undefined){
    const sub=recipes.find(x=>x.id===i.rref);if(!sub||stack.includes(sub.id))return{s:'noconv'};
    const q=(i.q===''||i.q==null||isNaN(+i.q))?null:+i.q*k,u=unitInfo(i.u),y=yieldOf(sub);
    if(q==null||!u||!y||(u[0]==='p')!==(y.ui[0]==='p'))return{s:'noconv'};
    const sc=recipeCost(sub,1,stack);
    return{s:'ok',c:sc.tot*(q*u[1])/(y.q*y.ui[1]),miss:sc.miss,bad:sc.bad};
  }
  const e=i.ref&&prices.find(x=>x.id===i.ref),p=e?(okP(e)?e:null):findPrice(i.name);if(!p)return{s:'noprice'};
  const q=(i.q===''||i.q==null||isNaN(+i.q))?null:+i.q*k,u=unitInfo(i.u);
  if(q==null||!u)return{s:'noconv'};
  if(p.per==='piece')return u[0]==='p'?{s:'ok',c:q*p.price}:{s:'noconv'};
  return u[0]==='p'?{s:'noconv'}:{s:'ok',c:q*u[1]*p.price};
}

    return[...used].filter(([n])=>!hasEntry(n)).map(x=>x[1]).sort((a,b)=>a.localeCompare(b))};
  const drawBoxes=()=>{
    const nm=missNames().length,un=prices.filter(p=>!p.type);
    const card=(t,a,extra)=>`<div class="tbox${t===''?' new':''}" data-b="${esc(t)}" style="${tsty(t)}"><h3>${boxIcon(t)} ${t?esc(t):'À trier'} <span class="st">(${a.length}${extra?` + ${extra} à classer`:''})</span></h3><ul>${[...a].sort(byName).slice(0,4).map(p=>`<li><span>${esc(p.name)}</span><span class="mu">${priceLbl(p)}</span></li>`).join('')}${a.length>4?`<li class="mu st">+ ${a.length-4} autres…</li>`:''}${!a.length&&!extra?'<li class="mu st">Vide</li>':''}</ul></div>`;
    pl.innerHTML=`<div class="tgrid">${(un.length||nm?[card('',un,nm)]:[]).concat(boxNames().map(t=>card(t,prices.filter(p=>p.type===t),0))).join('')}</div>`;
  };
  const drawList=()=>{
    const q=norm($('#pf').value),match=p=>!q||norm(famNames(p).join(' ')+' '+(p.type||'')).includes(q);

    if(!home){const a=prices.filter(p=>(p.type||'')===tcur&&match(p)).sort(byName);
      pl.innerHTML=a.map(famHtml).join('')||'<p class="mu st" id="pe">'+(q?'Aucun résultat.':'Cette boîte est vide.')+'</p>';return}
    const fl=prices.filter(match),groups=[...boxNames(),''].map(t=>[t,fl.filter(p=>(p.type||'')===t)]).filter(g=>g[1].length);
    pl.innerHTML=groups.map(([t,a])=>`<h3 class="gh" style="${tcol(t)?`border-left:6px solid ${tcol(t)};padding-left:8px`:''}">${boxIcon(t)} ${t?esc(t):'À trier'} <span class="st">(${a.length})</span></h3>`+a.sort(byName).map(famHtml).join('')).join('')||'<p class="mu st" id="pe">Aucun résultat.</p>';
  };
  async function persist(el){
    const id=el.dataset.id,name=el.querySelector('.pn').value.trim();if(!name)return;
    const c=clash(name,id);if(c){say('⚠️ « '+name+' » existe déjà (famille « '+c.name+' »)');return}
    const old=prices.find(x=>x.id===id)||{},v=parseFloat(el.querySelector('.pp').value.replace(',','.'));
    const it={...old,id,name,price:isNaN(v)?'':v,per:el.querySelector('.pu').value,type:el.querySelector('.pty').value,vars:(old.vars||[]).filter(x=>nn(x)!==nn(name))};
    const i=prices.findIndex(x=>x.id===id);if(i<0)prices.push(it);else prices[i]=it;
    el.classList.toggle('np',!okP(it));
    await saveFam(it);drawMiss();
  }
  // Ajout de variantes (séparées par des virgules) à une famille
  async function addVars(el,inp,refocus){
    const vals=inp.value.split(',').map(x=>x.trim()).filter(Boolean);inp.value='';
    if(!vals.length)return;
    const p=prices.find(x=>x.id===el.dataset.id);
    if(!p){say('⚠️ Donnez d\'abord un nom à la famille');return}
    const bad=[];let add=false;
    vals.forEach(v=>{const c=clash(v,'');
      if(c){if(c.id!==p.id)bad.push('« '+v+' » est déjà dans « '+c.name+' »')}
      else{p.vars=[...(p.vars||[]),v];add=true}});
    if(add)await saveFam(p);
    if(bad.length)say('⚠️ '+bad.join(' ; '));
    el.outerHTML=famHtml(p);drawMiss();
    if(refocus){const n=pl.querySelector(`[data-id="${p.id}"] .pv`);if(n)n.focus()}
  }
  // « À classer » : ingrédients des recettes absents de la liste
  const drawMiss=()=>{const m=tcur===''?missNames():[];
    $('#miss').innerHTML=m.length?`<div class="cost"><b>À classer</b> <span class="st">(utilisés dans vos recettes mais absents de la liste — touchez pour les ranger dans une famille)</span><div style="margin-top:6px">${m.map(x=>`<span class="chip" data-m="${esc(x)}">${esc(x)}</span>`).join('')}</div><div id="mp"></div></div>`:'';
    $('#miss').querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>showMp(c.dataset.m))};
  const showMp=name=>{const g=famGuess(name);
    $('#mp').innerHTML=`<div class="row" style="margin-top:10px"><span>« ${esc(name)} » →</span><select id="mps"><option value="">➕ Nouvelle famille</option>${famSelect('',g&&g.id)}</select><button class="p" id="mpo">OK</button><button id="mpc">Annuler</button></div>`;
    $('#mpc').onclick=()=>{$('#mp').innerHTML=''};
    $('#mpo').onclick=async()=>{const sid=$('#mps').value;let p;
      if(sid){p=prices.find(x=>x.id===sid);if(!p)return;p.vars=[...(p.vars||[]),name]}
      else{p={id:uid(),name,price:'',per:'kg',type:'',vars:[]};prices.push(p)}
      await saveFam(p);drawList();drawMiss();
      const el=pl.querySelector(`[data-id="${p.id}"]`);if(el){el.scrollIntoView({block:'center'});if(!sid)el.querySelector('.pp').focus()}}};

  pl.addEventListener('change',e=>{
    const el=e.target.closest('.fam');if(!el)return;
    if(e.target.classList.contains('pv')){addVars(el,e.target,false);return}
    persist(el).then(()=>{if(e.target.classList.contains('pty'))drawList()});
  });
  pl.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.classList.contains('pv')){e.preventDefault();addVars(e.target.closest('.fam'),e.target,true)}});
  pl.addEventListener('click',async e=>{
    const bx=e.target.closest('[data-b]');if(bx){view={m:'prices',t:bx.dataset.b};render();return}
    const el=e.target.closest('.fam');if(!el)return;
    const id=el.dataset.id,p=prices.find(x=>x.id===id),xv=e.target.closest('[data-xv]');
    if(xv&&p){p.vars.splice(+xv.dataset.xv,1);await saveFam(p);el.outerHTML=famHtml(p);drawMiss();return}
    if(e.target.closest('[data-x]')){
      if(!p){el.remove();return}
      const used=recipes.some(r=>(r.ings||[]).some(i=>i.ref===id));
      if(used&&!confirm('Cette famille est utilisée par des recettes. La supprimer quand même ?'))return;
      try{await store.delPrice(id);prices=prices.filter(x=>x.id!==id);say('✓ supprimé')}catch(err){say('⚠️ échec de la suppression');return}
      drawList();drawMiss();return}
    if(e.target.closest('[data-mg]')&&p){
      if(el.querySelector('.mgp'))return;
      el.insertAdjacentHTML('beforeend',`<div class="row mgp" style="margin-top:8px"><span class="st">Ranger « ${esc(p.name)} » (et ses variantes) dans :</span><select class="mgs">${famSelect(id,'')}</select><button class="p mgo">OK</button><button class="mgc">Annuler</button></div>`);return}
    if(e.target.closest('.mgc')){el.querySelector('.mgp').remove();return}
    if(e.target.closest('.mgo')&&p){
      const t=prices.find(x=>x.id===el.querySelector('.mgs').value);if(!t)return;
      t.vars=[...new Set([...(t.vars||[]),p.name,...(p.vars||[])])];
      prices=prices.filter(x=>x.id!==id);
      await saveFam(t);try{await store.delPrice(id)}catch(err){say('⚠️ l\'ancienne famille n\'a pas pu être supprimée')}
      // les recettes qui pointaient vers l'ancienne famille pointent vers la nouvelle
      for(const r of recipes){let ch=false;(r.ings||[]).forEach(i=>{if(i.ref===id){i.ref=t.id;ch=true}});if(ch)try{await store.save(r)}catch(err){}}
      drawList();drawMiss();say('✓ rangé dans « '+t.name+' »')}
  });
  $('#pa').onclick=()=>{
    if(home){view={m:'prices',t:'',draft:true};render();return}
    const pe=$('#pe');if(pe)pe.remove();
    pl.insertAdjacentHTML('afterbegin',famHtml({id:uid(),name:'',price:'',per:'kg',type:tcur,vars:[]}));pl.firstElementChild.querySelector('.pn').focus()};
  $('#pf').oninput=drawList;

  // Gestion des types (accueil)
  if(home){
  const drawTypes=()=>{tp.innerHTML=`<div class="cost"><b>Types d'ingrédients</b> <span class="st">(modifiez un nom pour le renommer ; ✕ retire le type des familles concernées)</span>${ptypes.map((t,k)=>`<div style="margin-top:12px"><div class="row"><input class="tn" data-k="${k}" value="${esc(t)}" style="flex:1"><button class="d" data-xt="${k}">✕</button></div>${pal(tcol(t),'data-tk="'+k+'"')}</div>`).join('')}<div class="row" style="margin-top:8px"><input id="tnew" placeholder="Nouveau type (ex. Surgelés)" style="flex:1"><button id="tadd">Ajouter</button></div></div>`};
  const retype=async(from,to)=>{for(const p of prices.filter(x=>(x.type||'')===from)){p.type=to;await saveFam(p)}};
  $('#pt').onclick=()=>{tp.hidden=!tp.hidden;if(!tp.hidden)drawTypes()};
  tp.addEventListener('change',async e=>{
    const inp=e.target.closest('.tn');if(!inp)return;
    const k=+inp.dataset.k,old=ptypes[k],nw=inp.value.trim();
    if(!nw||ptypes.some((t,j)=>j!==k&&norm(t)===norm(nw))){inp.value=old;return}
    if(nw===old)return;
    if(pcolors[old]){pcolors[nw]=pcolors[old];delete pcolors[old]}ptypes[k]=nw;await retype(old,nw);await saveTypes();drawList();drawTypes()});
  tp.addEventListener('click',async e=>{
    const sw=e.target.closest('[data-col]');if(sw){const nm=ptypes[+sw.closest('.pal').dataset.tk];if(nm!==undefined){if(sw.dataset.col)pcolors[nm]=sw.dataset.col;else delete pcolors[nm];await saveTypes();drawList();drawTypes()}return}
    const x=e.target.closest('[data-xt]');
    if(x){const k=+x.dataset.xt,old=ptypes[k];ptypes.splice(k,1);delete pcolors[old];await retype(old,'');await saveTypes();drawList();drawTypes();return}
    if(e.target.closest('#tadd')){const v=$('#tnew').value.trim();if(!v||ptypes.some(t=>norm(t)===norm(v)))return;ptypes.push(v);await saveTypes();drawList();drawTypes()}});

  }
  if(!home&&tcur){
    const paint=()=>{const c=tcol(tcur);$('#bh').style.borderLeft=c?'8px solid '+c:'';$('#bh').style.paddingLeft=c?'10px':''};
    const drawBc=()=>{$('#bcw').innerHTML=`<div class="row" style="margin:6px 0"><span class="st">Couleur de la boîte</span></div>${pal(tcol(tcur),'')}`;paint()};
    $('#bcw').onclick=async e=>{const sw=e.target.closest('[data-col]');if(!sw)return;if(sw.dataset.col)pcolors[tcur]=sw.dataset.col;else delete pcolors[tcur];drawBc();await saveTypes()};
    drawBc();
  }
  drawList();drawMiss();
  if(view.draft){delete view.draft;$('#pa').click()}
}
function show(){
  const r=recipes.find(x=>x.id===view.id); if(!r){view={m:'list'};return list()}
  const base=+r.serv||1, s=view.serv||base, k=s/base;
  app.innerHTML=`<div class="row"><button id="bk">← Retour</button><span style="flex:1"></span><button id="ed">Modifier</button><button class="d" id="dl">Supprimer</button></div>
  <h2 style="font-family:Lato,system-ui,sans-serif;margin:12px 0 4px">${esc(r.title)}</h2>
  <div>${catsOf(r).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}${r.saison&&r.saison!=='intemporel'?`<span class="chip">${saisLabel(r.saison)}</span>`:''}${(r.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div>
  ${imgUrl(r.img)?`<img class="hero" src="${esc(imgUrl(r.img))}" alt="">`:''}
  ${/^https?:\/\//.test(r.source||'')?`<p class="st">Source : <a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer" style="color:var(--ac)">${esc(r.source)}</a></p>`:(r.source?`<p class="st">Source : ${esc(r.source)}</p>`:'')}
  <p>⏱️ Préparation : <b>${num(r.prep)} min</b> · 🔥 Cuisson : <b>${num(r.cook)} min</b></p>
  ${num(r.yq)?`<p>🥣 Rendement : <b>${fmt(num(r.yq)*k)} ${esc(r.yu||'')}</b></p>`:''}
  <div class="row"><b>Quantités pour</b><button id="mi">−</button><b>${s}</b><button id="pl">+</button><span class="mu">personnes</span>
  ${[0.5,2,3].map(m=>`<button data-m="${m}">×${m}</button>`).join('')}${s!==base?'<button id="rs">Réinitialiser</button>':''}</div>
  <h3>Ingrédients</h3><ul>${(r.ings||[]).map(i=>i.t?`<li class="ti">${esc(i.name)}</li>`:`<li><b>${i.q!==''&&i.q!=null&&!isNaN(+i.q)?fmt(+i.q*k):esc(i.q)}</b> ${esc(i.u||'')} ${i.rref!==undefined&&recipes.some(x=>x.id===i.rref)?`<a href="#" data-r="${esc(i.rref)}" style="color:var(--ac)">🥣 ${esc(ingName(i))}</a>`:esc(ingName(i))}${(lc=>lc.s==='ok'&&lc.c>0?` <span class="mu">· ${lc.miss&&lc.miss.length?'≥ ':''}${eur(lc.c)}</span>`:'')(lineCost(i,k))}</li>`).join('')}</ul>
  ${costBlock(r,k,s)}
  <h3>Préparation</h3><div class="steps">${esc(r.steps||'')}</div>`;
  $('#bk').onclick=()=>{view=view.from?{m:'show',id:view.from,serv:null}:{m:'list'};render()};
  app.querySelectorAll('[data-r]').forEach(a=>a.onclick=e=>{e.preventDefault();view={m:'show',id:a.dataset.r,serv:null,from:r.id};render()});
  $('#ed').onclick=()=>{view={m:'edit',r:JSON.parse(JSON.stringify(r))};render()};
  const gp=$('#gp');if(gp)gp.onclick=()=>{view={m:'prices'};render()};
  $('#dl').onclick=()=>{$('#dl').outerHTML=`<span class="row"><b style="color:#c0392b">Supprimer ?</b><button class="d" id="dy">Oui, supprimer</button><button id="dn">Non</button></span>`;
    $('#dy').onclick=async()=>{try{await store.del(r.id)}catch(e){$('#dy').closest('.row').innerHTML='<b style="color:#c0392b">⚠️ Échec de la suppression</b>';return}view={m:'list'};render()};
    $('#dn').onclick=()=>show()};
  $('#mi').onclick=()=>{view.serv=Math.max(1,s-1);show()};$('#pl').onclick=()=>{view.serv=s+1;show()};
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{view.serv=Math.max(1,Math.round(base*b.dataset.m));show()});
  const rs=$('#rs');if(rs)rs.onclick=()=>{view.serv=null;show()};
}

  const mvH=n=>`<span class="mv"><button data-up="${n}" title="Monter" ${n===0?'disabled':''}>▲</button><button data-dn="${n}" title="Descendre" ${n===r.ings.length-1?'disabled':''}>▼</button></span>`;
  const mv=(n,d)=>{n=+n;const j=n+d;if(j<0||j>=r.ings.length)return;[r.ings[n],r.ings[j]]=[r.ings[j],r.ings[n]];drawI();
    const b=il.querySelector(`[data-${d<0?'up':'dn'}="${j}"]:not([disabled])`)||il.querySelector(`[data-${d<0?'dn':'up'}="${j}"]`);if(b)b.focus()};
  const subRow=(i,n)=>`<div class="ing"><span style="text-align:center" title="Recette">🥣</span><select data-n="${n}" data-rr><option value="">— Choisir une recette —</option>${recipes.filter(x=>x.id!==r.id&&!contains(x.id,r.id)).sort(byTitle).map(x=>`<option value="${esc(x.id)}" ${x.id===i.rref?'selected':''}>${esc(x.title)} (${esc(ylab(x))})</option>`).join('')}</select><input data-n="${n}" data-k="q" inputmode="decimal" placeholder="Qté" value="${esc(i.q)}"><input data-n="${n}" data-k="u" placeholder="g, ml, portions…" value="${esc(i.u)}">${mvH(n)}<button data-x="${n}">✕</button></div>`;
  const drawI=()=>{il.innerHTML=r.ings.map((i,n)=>i.rref!==undefined?subRow(i,n):`<div class="ing${i.t?' t':''}"><input type="checkbox" class="tc" data-t="${n}" ${i.t?'checked':''} title="Titre de section (ex. Pâte, Crème…)"><input data-n="${n}" data-k="name" placeholder="${i.t?'Titre (ex. Pâte, Garniture…)':'Ingrédient (choisir ou saisir)'}" ${i.t?'':'list="dl-ing" autocomplete="off"'} value="${esc(i.t?i.name:ingName(i))}"><input data-n="${n}" data-k="q" inputmode="decimal" placeholder="Qté" value="${esc(i.q)}"><input data-n="${n}" data-k="u" placeholder="g, ml…" value="${esc(i.u)}">${mvH(n)}<button data-x="${n}">✕</button></div>`).join('');

    il.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{r.ings.splice(b.dataset.x,1);drawI()});
    il.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));
    il.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
    il.querySelectorAll('[data-rr]').forEach(sl=>sl.onchange=()=>{const i=r.ings[sl.dataset.n],x=recipes.find(y=>y.id===sl.value);i.rref=sl.value;i.name=x?x.title:'';
      if(x&&i.q===''&&!i.u){i.q=x.yq>0?+x.yq:(+x.serv||1);i.u=x.yq>0?(x.yu||''):'portions'}drawI()})};
  drawI();
  $('#ai').onclick=()=>{r.ings.push({q:'',u:'',name:''});drawI()};
  $('#ar').onclick=()=>{r.ings.push({rref:'',q:'',u:'',name:''});drawI()};
  $('#fi').onchange=async e=>{const f=e.target.files[0];if(!f||!assets)return;$('#fs').textContent='Envoi…';
    try{const blob=await shrink(f);const up=await assets.upload(blob);r.img=up.id;const pv=$('#pv');if(pv){pv.src=imgUrl(up.id);pv.hidden=false}$('#fs').textContent='✓ Photo ajoutée'}catch(err){$('#fs').textContent='Échec de l\'envoi de la photo'}};
  r.saison=r.saison||'intemporel';
  $('#sa').querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{r.saison=c.dataset.s;$('#sa').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===c))});
  const tg=$('#tg'),tsg=$('#tsg');
  const cl=x=>norm(x).trim().replace(/^#/,'');
  const drawT=()=>{const p=tg.value.split(','),cur=cl(p[p.length-1]),have=p.slice(0,-1).map(cl);
    const sug=tags().filter(t=>!have.includes(norm(t))&&norm(t)!==cur&&(!cur||norm(t).includes(cur))).slice(0,14);
    tsg.innerHTML=sug.map(t=>`<span class="chip" data-tg="${esc(t)}">#${esc(t)}</span>`).join('');
    tsg.querySelectorAll('[data-tg]').forEach(c=>c.onclick=()=>{const q=tg.value.split(',');q[q.length-1]=c.dataset.tg;tg.value=q.map(x=>x.trim()).filter(Boolean).join(', ')+', ';drawT();tg.focus()})};
  tg.oninput=drawT;drawT();
  $('#cn').onclick=()=>{view={m:'list'};render()};
  $('#sv2').onclick=async()=>{
    r.title=$('#ti').value.trim(); if(!r.title){$('#er').textContent='Donnez un titre.';return}
    r.source=$('#so').value.trim();r.carousel=$('#cr2').checked;{const pend=$('#cn2').value.trim();if(pend&&!r.cats.includes(pend))r.cats.push(pend);delete r.cat}{const canon=new Map(tags().map(t=>[norm(t),t])),seen=new Map();$('#tg').value.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean).forEach(t=>{const k=norm(t);if(!seen.has(k))seen.set(k,canon.get(k)||t)});r.tags=[...seen.values()]}
    r.yq=parseFloat($('#yq').value.replace(',','.'))||'';r.yu=r.yq?$('#yu').value.trim():'';r.prep=+$('#pr').value||0;r.cook=+$('#ck').value||0;r.serv=+$('#sv').value||1;r.steps=$('#stp').value;
    r.ings=r.ings.filter(i=>i.rref!==undefined?!!i.rref:(String(i.name).trim()||String(i.q).trim()));
    // Relie chaque ingrédient à sa famille s'il porte exactement son nom ou celui d'une variante (sinon il apparaîtra dans « À classer »)
    r.ings.forEach(i=>{if(i.t||i.rref!==undefined){delete i.ref;return}const f=String(i.name).trim()?famByName(i.name):null;
      if(f){i.ref=f.id;i.name=famNames(f).find(x=>nn(x)===nn(i.name))}else delete i.ref});
    try{await store.save(r)}catch(e){$('#er').textContent='Erreur d\'enregistrement.';return}
    view={m:'show',id:r.id,serv:null};render()};
}

// ---------- Import d'une recette depuis un PDF ----------
// pdf.js : cherché d'abord dans lib/ (usage hors ligne), sinon téléchargé depuis cdnjs
let pdfP=null;
const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error(src));document.head.appendChild(s)});
function loadPdfJs(){
  if(pdfP)return pdfP;
  pdfP=(async()=>{
    const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';let base='lib/';
    try{await loadScript(base+'pdf.min.js')}catch(e){base=CDN;await loadScript(base+'pdf.min.js')}
    const w=await fetch(base+'pdf.worker.min.js').then(r=>{if(!r.ok)throw 0;return r.text()});
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
  })();
  pdfP.catch(()=>{pdfP=null});
  return pdfP;
}
// Extrait les lignes de texte (avec leur taille de police) en regroupant les éléments par position verticale
async function pdfLines(file){
  await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await(await pdf.getPage(p)).getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str)return;const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||it.height||0;
      let row=rows.find(r=>Math.abs(r.y-y)<Math.max(2,h*.4));
      if(!row){row={y,h:0,its:[]};rows.push(row)}
      row.its.push({x,s:it.str,w:it.width||0});row.h=Math.max(row.h,h)});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{
      r.its.sort((a,b)=>a.x-b.x);let t='',end=null;
      r.its.forEach(i=>{if(end!=null&&i.x-end>1&&!/\s$/.test(t)&&!/^\s/.test(i.s))t+=' ';t+=i.s;end=i.x+i.w});
      t=t.replace(/\s+/g,' ').trim();if(t)out.push({t,h:r.h})});
  }
  return out;
}
const FRAC={'½':'1/2','¼':'1/4','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8'};
const UNIT_RE=/^(kg|mg|g|gr|ml|cl|dl|l|litres?|grammes?|pi[eè]ces?|cuill[eè]res?\s+[àa]\s+(?:soupe|caf[eé])|c\.?\s*[àa]\.?\s*(?:soupe|caf[eé]|s|c)\b\.?|c[àa][sc])(?![a-zà-ÿ])/i;
// "200 g de farine" -> {q:200,u:'g',name:'Farine'}
function parseIngLine(raw){
  let s=raw.replace(/^[\s•·▪■□●○\-–—*✓]+/,'').replace(/[½¼¾⅓⅔⅛]/g,c=>' '+FRAC[c]).replace(/\s+/g,' ').trim(),q='',u='',m;
  if(m=s.match(/^(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)/)){q=Math.round(((+m[1]||0)+m[2]/m[3])*100)/100;s=s.slice(m[0].length).trim()}
  else if(m=s.match(/^(\d+(?:[.,]\d+)?)(?:\s*(?:à|a|-|–)\s*\d+(?:[.,]\d+)?(?!\d))?/)){q=parseFloat(m[1].replace(',','.'));s=s.slice(m[0].length).trim()}
  if(q!==''&&(m=s.match(UNIT_RE))){
    u=m[1].toLowerCase();s=s.slice(m[0].length).trim();
    const k=norm(u).replace(/[.\s]/g,'');
    if(/soupe$|^cas$/.test(k))u='c. à soupe';else if(/cafe$|^cac$/.test(k))u='c. à café';
    s=s.replace(/^(d['’]\s*|de\s+(la\s+|l['’]\s*)?|du\s+|des\s+)/i,'');
  }
  s=s.replace(/^[,.:;\s]+/,'');
  return{q,u,name:s.charAt(0).toUpperCase()+s.slice(1)};
}
function parseRecipeText(L,fname){
  L=L.filter(l=>!/^(page\s*)?\d+\s*(\/|sur)\s*\d+$/i.test(l.t));
  if(!L.length)return null;
  // Titre : la plus grande police parmi les premières lignes (sinon la première ligne)
  const first=L.slice(0,12),mx=Math.max(...first.map(l=>l.h)),ti=Math.max(0,first.findIndex(l=>l.h>=mx-.5));
  const title=L[ti].t,lines=L.filter((_,i)=>i!==ti).map(l=>l.t);
  const n0=l=>norm(l).replace(/[:\s.]+$/,'').trim();
  const isIngH=n=>/^(les )?ingredients?\b/.test(n)&&n.length<60;
  const isStH=n=>/^(la |les )?(preparation|procede|etapes?|instructions?|realisation|deroulement|methode|recette)( de la recette| de la preparation)?$/.test(n);
  const hasSec=lines.some(l=>isIngH(n0(l))||isStH(n0(l)));
  const qty=/^[\s•·▪■●○\-–—*]*(\d|[½¼¾⅓⅔⅛])/;
  let serv=0,prep=0,cook=0,st='pre';const ings=[],stepsL=[],extra=[];
  const dur=s=>{let m=s.match(/(\d+)\s*h\s*(\d+)?/);if(m)return m[1]*60+(+m[2]||0);m=s.match(/(\d+)\s*(?:min|mn)/);return m?+m[1]:0};
  const meta=l=>{const n=norm(l);let hit=false,m;
    if(m=n.match(/(?:preparation|prepa)\b\D{0,25}?(\d+\s*h\s*\d*|\d+\s*(?:min|mn))/)){prep=prep||dur(m[1]);hit=true}
    if(m=n.match(/cuisson\b\D{0,25}?(\d+\s*h\s*\d*|\d+\s*(?:min|mn))/)){cook=cook||dur(m[1]);hit=true}
    if(m=n.match(/(?:pour|personnes|portions|parts|convives)\s*:?\s*(\d+)/)||n.match(/(\d+)\s*(?:personnes?|pers\b|convives)/)){serv=serv||+m[1];hit=true}
    if(!hit&&/(repos|temps total|refrigerat|marinade)\D{0,25}\d/.test(n)){extra.push(l);hit=true}
    return hit};
  const addIng=l=>{
    if(!/\d/.test(l)&&(/:$/.test(l)||/^pour (la|le|les|l['’])\b/i.test(l)||(l===l.toUpperCase()&&/[A-ZÀ-Ý]/.test(l)&&l.length<30)))
      ings.push({t:true,name:l.replace(/[:\s]+$/,''),q:'',u:''});
    else ings.push(parseIngLine(l))};
  for(const l of lines){
    const n=n0(l);
    if(isIngH(n)){st='ing';meta(l);continue}
    if(isStH(n)){st='steps';continue}
    if(!hasSec){(qty.test(l)&&l.length<90?ings:stepsL).push(...(qty.test(l)&&l.length<90?[parseIngLine(l)]:[l]));continue}
    if(st!=='steps'&&l.length<80&&meta(l))continue;
    if(st==='pre'){if(qty.test(l)&&l.length<90)addIng(l)}
    else if(st==='ing'){
      const stepLike=/^(etape\s*)?\d+\s*[.)]\s+\S/.test(norm(l));
      if(stepLike||l.length>=90){st='steps';stepsL.push(l)}else addIng(l)}
    else stepsL.push(l);
  }
  // Procédé : on recolle les lignes coupées par la mise en page
  const steps=[];let pend='';
  stepsL.forEach(l=>{
    if(/^\d+[.)]?$/.test(l)){pend=l.replace(/[.)]$/,'')+'. ';return}
    l=pend+l;pend='';
    const last=steps.length-1,isNew=/^(\d+\s*[.)]|[•·▪■●○\-–—*])\s*/.test(l);
    if(last<0||isNew||/[.!?:;]$/.test(steps[last]))steps.push(l);else steps[last]+=' '+l});
  if(!ings.length)ings.push({q:'',u:'',name:''});
  return{id:uid(),title,source:fname,cats:[],tags:[],prep:prep||'',cook:cook||'',serv:serv||4,ings,
    steps:extra.concat(steps).join('\n\n'),img:'',saison:'intemporel',carousel:true};
}
async function importPdf(file){
  const msg=$('#imps');msg.textContent='Lecture du PDF…';
  try{
    const lines=await pdfLines(file);
    const rec=lines.length?parseRecipeText(lines,file.name):null;
    if(!rec){msg.textContent='⚠️ Aucun texte trouvé dans ce PDF (document scanné ?).';return}
    view={m:'edit',r:rec,note:'📄 Importé depuis « '+file.name+' » : vérifiez et corrigez les champs avant d\'enregistrer.'};
    render();
  }catch(e){msg.textContent='⚠️ Lecture impossible. Bibliothèque PDF introuvable (connexion internet requise, ou placez pdf.min.js et pdf.worker.min.js dans le dossier lib/) ou fichier invalide.'}
}

function shrink(file){return new Promise((res,rej)=>{const im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(url);const m=1200,s=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?res(b):rej(),'image/jpeg',.82)};im.onerror=e=>{URL.revokeObjectURL(url);rej(e)};im.src=url})}
init();
